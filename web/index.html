<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1F4D" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Appearance chosen on this device (Light or Dark), applied before the page draws so it never flashes.
      try { var t = localStorage.getItem('nes.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>NavShiksha · Navy Education Society</title>
    <link rel="icon" href="/brand/navshiksha/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/navshiksha/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/navshiksha/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/navshiksha/apple-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="NavShiksha" />
    <meta property="og:title" content="NavShiksha · Navy Education Society" />
    <meta property="og:description" content="The school system of the Navy Education Society for Navy Children Schools and Navy Kindergartens." />
    <meta property="og:image" content="/brand/navshiksha/social-preview-1200.png" />
    <meta property="og:type" content="website" />
    <meta name="description" content="NavShiksha: the school system of the Navy Education Society for Navy Children Schools and Navy Kindergartens." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <noscript><div style="max-width:520px;margin:15vh auto;padding:32px;font:16px/1.5 -apple-system,sans-serif;text-align:center"><b>NavShiksha needs JavaScript.</b><br />Turn it on in the browser's settings, then reload. (NS-APP)</div></noscript>
    <script>
      // If the app cannot start (an old copy of the page after an update, or a blocked file), show a
      // message instead of a blank page. The app clears this check as soon as it draws anything.
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.childElementCount) r.innerHTML = '<div style="max-width:520px;margin:15vh auto;padding:32px;background:#fff;border-radius:20px;font:16px/1.5 Inter,Roboto,Segoe UI,system-ui,-apple-system,sans-serif;color:#0F172A"><code style="font-size:13px;color:#3A3A3C">NS-APP</code><h1 style="font-size:24px;margin:12px 0 8px">NavShiksha could not start</h1><p style="color:#3A3A3C">NavShiksha may have just been updated. Reload the page to get the new version. Nothing you saved has been lost.</p><button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border:0;border-radius:999px;background:#173A7A;color:#fff;font:inherit;cursor:pointer">Reload</button></div>';
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
